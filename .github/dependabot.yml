version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: daily
    time: 05:00
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: 05:00
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
