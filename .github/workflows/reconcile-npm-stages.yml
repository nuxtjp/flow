name: Verify published npm stage notices
on:
  schedule:
    - cron: '19 19 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/npm-release/**'
      - '.github/workflows/reconcile-npm-stages.yml'
permissions:
  contents: read
concurrency:
  group: npm-notice-verification-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: node --test tools/npm-release/publication.test.mts
  reconcile:
    needs: verify-source
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.event.repository.default_branch }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: npm install --global --ignore-scripts npm@12.2.0
      - env: {GH_TOKEN: '${{ github.token }}', NODE_AUTH_TOKEN: '', NPM_TOKEN: ''}
        run: node tools/npm-release/reconcile.mts
